# Prüfungen, die sowohl die CI als auch der Deploy-Workflow fahren.
# Als wiederverwendbarer Workflow, damit beide genau dasselbe prüfen und
# nichts auseinanderläuft.

name: Prüfungen

on:
  workflow_call:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint und Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        # Die Suite prüft alle sechs Akzeptanzkriterien aus der Spec
        # gegen die echten Rezepte im Repo.
        run: pytest -q --junit-xml=pytest-report.xml

      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  stammdaten:
    name: Rezepte und Zutaten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Ausschlüsse, Protein und Referenzen prüfen
        # Fängt genau den Fall ab, der sonst erst in der Mail auffällt:
        # ein Rezept mit Fenchel, Salbei oder Blauschimmel, eine Zutat
        # ohne Stammdaten oder eine Proteinangabe, die nicht stimmt.
        run: essensplaner validate

      - name: Probeplan erzeugen und Mails rendern
        # Rauchtest über den ganzen Weg: planen, Listen bauen, Mail
        # rendern – ohne etwas zu verschicken.
        run: |
          essensplaner generate-month --seed 1 --dry-run
          essensplaner preview weekly --out /tmp/weekly.html
          essensplaner preview monthly --out /tmp/monthly.html
          test -s /tmp/weekly.html
          test -s /tmp/monthly.html

  image:
    name: Image baut und läuft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: essensplaner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rauchtest im Container
        # Stellt sicher, dass Konfiguration, Rezepte und Templates im
        # Image liegen und die CLI als Nutzer "essensplaner" arbeiten kann.
        run: |
          docker run --rm essensplaner:ci validate
          docker run --rm essensplaner:ci generate-month --seed 1 --dry-run
          docker run --rm essensplaner:ci serve --once
