steps:
  - Süßkartoffeln schälen und in 2 cm große Würfel schneiden.
  - Zwiebel und Knoblauch in Öl andünsten, Gewürze zugeben und kurz mitrösten.
  - Süßkartoffeln, rote Linsen, gehackte Tomaten, 500 ml Wasser und Brühe zugeben und 20 Minuten köcheln.
  - Abgetropfte Bohnen und Mais unterrühren und 5 Minuten ziehen lassen.
  - Mit Limettensaft und Salz abschmecken, Skyr als Topping auf dem Teller.
  - Süßkartoffeln halten sich lange – passt gut in den MI-Slot.
