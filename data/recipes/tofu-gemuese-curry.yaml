slug: tofu-gemuese-curry
name: Tofu-Gemüse-Curry mit Reis
core: true
slots: [MO, MI]
tags: [lunchbox_ok, kids_ok, schnell]
seasons: all
prep_minutes: 30
base_servings: 4
protein_per_serving_g: 25
ingredients:
  - { item: tofu_natur, qty: 400, unit: g }
  - { item: speisestaerke, qty: 2, unit: EL }
  - { item: oel_sonnenblume, qty: 3, unit: EL }
  - { item: zwiebel, qty: 1, unit: Stk }
  - { item: knoblauch, qty: 2, unit: Stk }
  - { item: ingwer, qty: 20, unit: g }
  - { item: wokgemuese_tk, qty: 500, unit: g }
  - { item: kokosmilch, qty: 1, unit: Dose }
  - { item: sojasauce, qty: 2, unit: EL }
  - { item: kurkuma, qty: 1, unit: TL }
  - { item: koriander_gemahlen, qty: 1, unit: TL }
  - { item: reis, qty: 300, unit: g }
  - { item: salz, qty: 1, unit: TL }
steps:
  - Tofu abtropfen, in Würfel schneiden, in Speisestärke wenden und in 2 EL Öl rundum goldbraun braten. Herausnehmen.
  - Zwiebel, Knoblauch und Ingwer im restlichen Öl andünsten, Gewürze zugeben.
  - TK-Gemüse zugeben und 5 Minuten unter Rühren anbraten.
  - Kokosmilch und Sojasauce angießen, 8 Minuten köcheln lassen.
  - Tofu unterheben, mit Salz abschmecken und mit Reis servieren.
variants:
  protein:
    hinweis: Edamame liefern den Rest zum Pflichtminimum für MO/MI.
    zusatz:
      - { item: edamame_tk, qty: 200, unit: g }
    protein_per_serving_g: 31
    zusatz_steps:
      - Edamame in den letzten 5 Minuten mitgaren.
