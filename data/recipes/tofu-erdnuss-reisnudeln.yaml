steps:
  - Tofu würfeln und in Öl rundum knusprig braten, herausnehmen.
  - Knoblauch und Ingwer im gleichen Topf andünsten, Erdnussbutter und Kokosmilch zugeben und glatt rühren.
  - Mit Sojasauce, Honig und Limettensaft abschmecken – mild halten, keine Chili.
  - Möhrenstifte und Edamame 4 Minuten in der Sauce garen.
  - Reisnudeln nach Packungsanweisung einweichen oder kochen, abgießen und unter die Sauce heben.
  - Tofu, Frühlingszwiebeln und Sesam darüber geben.
