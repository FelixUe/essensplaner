    protein_per_serving_g: 34
    zusatz_steps:
      - Berglinsen von Anfang an mitkochen, sie brauchen etwa 25 Minuten.
      - Veggie-Hack separat anbraten, weiße Bohnen abgetropft zum Schluss unterrühren.
