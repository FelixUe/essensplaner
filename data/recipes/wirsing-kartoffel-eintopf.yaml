steps:
  - Wirsing vom Strunk befreien, in Streifen schneiden und waschen.
  - Kartoffeln und Möhren würfeln, Zwiebel fein hacken.
  - Butter erhitzen, Zwiebel andünsten, Wirsing portionsweise zusammenfallen lassen.
  - Kartoffeln, Möhren, 700 ml Wasser, Brühe, Kümmel und Lorbeer zugeben und 25 Minuten köcheln.
  - Lorbeer entfernen, Sahne einrühren, mit Salz, Pfeffer und Muskat abschmecken.
  - Kohl und Kartoffeln halten sich gut – der Eintopf passt deshalb auch in den MI-Slot.
variants:
