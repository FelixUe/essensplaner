# Essensplaner – läuft so auf einem Home-Server und unverändert
# auf jeder anderen Maschine mit Docker.
#
#     cp .env.example .env     # und ausfüllen
#     docker compose up -d
#
# Diese Datei bleibt bewusst frei von Rechner-Eigenheiten. Was nur für ein
# bestimmtes Ziel gilt – etwa das Veröffentlichen von Port 8080 im LAN –
# gehört in eine docker-compose.override.yml dort. Siehe docs/deployment.md.
#
# Das Image kommt aus der GitHub-Registry und wird von der Pipeline
# gebaut. Wer selbst bauen will, kommentiert `build: .` ein.

services:
  essensplaner:
    image: ${ESSENSPLANER_IMAGE:-ghcr.io/felixue/essensplaner:latest}
    # build: .
    restart: unless-stopped

    # Bewusst kein container_name: Ein fester Name blockiert den Rollout,
    # weil der neue Container startet, solange der alte den Namen noch hält.

    environment:
      # Zeitzone bestimmt, wann "Freitag 07:00" ist.
      TZ: ${TZ:-Europe/Berlin}

      # Eigene Konfiguration statt der Beispieldatei aus dem Image. Liegt sie
      # im Volume, überlebt sie jeden Rollout und landet nie im Repository.
      # Leer lassen, um die mitgelieferte config.yaml zu verwenden.
      ESSENSPLANER_CONFIG: ${ESSENSPLANER_CONFIG:-}

      # Mailversand ist optional. Bleibt SMTP_HOST leer, erzeugt der
      # Scheduler weiterhin Pläne und verschickt nur nichts – die Übersicht
      # steht dann in der Weboberfläche. Passwörter gehören in die .env
      # mit chmod 600, nie in diese Datei.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}

      # Weboberfläche: Monatsplan ansehen und Gerichte tauschen.
      # Ohne Passwort startet sie nicht – eine offene Seite, auf der Fremde
      # den Essensplan umbauen, wäre schlimmer als keine Seite.
      ESSENSPLANER_WEB_PASSWORT: ${ESSENSPLANER_WEB_PASSWORT:-}
      # Fester Wert, damit eine Anmeldung einen Rollout überlebt.
      ESSENSPLANER_WEB_SECRET: ${ESSENSPLANER_WEB_SECRET:-}
      ESSENSPLANER_WEB_PORT: ${ESSENSPLANER_WEB_PORT:-8080}
      # Nur für den Betrieb ohne HTTPS. Auf true wird das Sitzungs-Cookie
      # auch unverschlüsselt gesendet – im LAN vertretbar, mit öffentlicher
      # Domain nicht. Hinter einem TLS-Proxy bleibt es auf false.
      ESSENSPLANER_WEB_UNSICHER: ${ESSENSPLANER_WEB_UNSICHER:-false}
      # Trägt ein Proxy eine Domain ein, landet sie hier. Leer lassen, wenn
      # der Dienst den Port direkt veröffentlicht.
      SERVICE_FQDN_ESSENSPLANER_8080: ${SERVICE_FQDN_ESSENSPLANER_8080:-}

      # Optional: Gefriertruhe vorhanden, fester Seed, Claude-API.
      ESSENSPLANER_FREEZER: ${ESSENSPLANER_FREEZER:-false}
      ESSENSPLANER_SEED: ${ESSENSPLANER_SEED:-}
      ESSENSPLANER_AI: ${ESSENSPLANER_AI:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: Rezepte (mealie-sync) und Einkaufszettel (mealie-einkauf,
      # sonntags automatisch) nach Mealie. MEALIE_EINKAUFSLISTE ändert den
      # Listennamen (Default "Wocheneinkauf").
      MEALIE_URL: ${MEALIE_URL:-}
      MEALIE_TOKEN: ${MEALIE_TOKEN:-}
      MEALIE_EINKAUFSLISTE: ${MEALIE_EINKAUFSLISTE:-}

    expose:
      - "8080"

    # Veröffentlicht wird der Port nicht hier, sondern in einer
    # docker-compose.override.yml auf dem jeweiligen Rechner – damit liegt
    # die Oberfläche etwa auf http://homeserver:8080. Für einen
    # schnellen lokalen Versuch:
    #
    #     echo 'services: {essensplaner: {ports: ["8080:8080"]}}' > docker-compose.override.yml

    volumes:
      # Die erzeugten Monatspläne und der Lauf-Zustand. Ohne dieses
      # Volume wäre nach jedem Rollout der Plan weg und die nächste
      # Freitagsmail würde einen neuen würfeln.
      - essensplaner-plans:/data/plans

    healthcheck:
      test: ["CMD", "essensplaner", "validate", "--no-protein"]
      interval: 5m
      timeout: 30s
      start_period: 20s
      retries: 2

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  essensplaner-plans:
