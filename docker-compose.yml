# Essensplaner – für Coolify auf dem Hetzner-Server und unverändert
# für die Homelab-Hardware.
#
# Coolify kann diese Datei direkt als "Docker Compose"-Ressource nutzen.
# Lokal oder im Homelab reicht:
#
#     cp .env.example .env     # und ausfüllen
#     docker compose up -d
#
# Das Image kommt aus der GitHub-Registry und wird von der Pipeline
# gebaut. Wer selbst bauen will, kommentiert `build: .` ein.

services:
  essensplaner:
    image: ${ESSENSPLANER_IMAGE:-ghcr.io/felixue/essensplaner:latest}
    # build: .
    restart: unless-stopped

    # Bewusst kein container_name: Coolify vergibt eigene Namen. Ein fester
    # Name blockiert dort den Rollout, weil der neue Container startet,
    # solange der alte den Namen noch hält.

    environment:
      # Zeitzone bestimmt, wann "Freitag 07:00" ist.
      TZ: ${TZ:-Europe/Berlin}

      # Mailversand ist optional. Bleibt SMTP_HOST leer, erzeugt der
      # Scheduler weiterhin Pläne und verschickt nur nichts – die Übersicht
      # steht dann in der Weboberfläche. Passwörter in Coolify als Secret.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}

      # Weboberfläche: Monatsplan ansehen und Gerichte tauschen.
      # Ohne Passwort startet sie nicht – eine offene Seite, auf der Fremde
      # den Essensplan umbauen, wäre schlimmer als keine Seite.
      ESSENSPLANER_WEB_PASSWORT: ${ESSENSPLANER_WEB_PASSWORT:-}
      # Fester Wert, damit eine Anmeldung einen Rollout überlebt.
      ESSENSPLANER_WEB_SECRET: ${ESSENSPLANER_WEB_SECRET:-}
      ESSENSPLANER_WEB_PORT: ${ESSENSPLANER_WEB_PORT:-8080}
      # Nur für den Betrieb ohne HTTPS, etwa lokal. In Coolify bleibt das aus.
      ESSENSPLANER_WEB_UNSICHER: ${ESSENSPLANER_WEB_UNSICHER:-false}
      # Coolify trägt hier die vergebene Domain ein und leitet auf Port 8080.
      SERVICE_FQDN_ESSENSPLANER_8080: ${SERVICE_FQDN_ESSENSPLANER_8080:-}

      # Optional: Gefriertruhe vorhanden, fester Seed, Claude-API.
      ESSENSPLANER_FREEZER: ${ESSENSPLANER_FREEZER:-false}
      ESSENSPLANER_SEED: ${ESSENSPLANER_SEED:-}
      ESSENSPLANER_AI: ${ESSENSPLANER_AI:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    expose:
      - "8080"

    # Lokal ohne Coolify: diese zwei Zeilen einkommentieren, dann liegt die
    # Oberfläche auf http://localhost:8080. In Coolify bleiben sie weg, dort
    # macht der eingebaute Proxy die Zuordnung über die Domain.
    # ports:
    #   - "8080:8080"

    volumes:
      # Die erzeugten Monatspläne und der Lauf-Zustand. Ohne dieses
      # Volume wäre nach jedem Rollout der Plan weg und die nächste
      # Freitagsmail würde einen neuen würfeln.
      - essensplaner-plans:/data/plans

    healthcheck:
      test: ["CMD", "essensplaner", "validate", "--no-protein"]
      interval: 5m
      timeout: 30s
      start_period: 20s
      retries: 2

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  essensplaner-plans:
