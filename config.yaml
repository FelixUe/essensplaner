# Essensplaner – Beispielkonfiguration
#
# Alle Werte hier sind fachliche Vorgaben, keine Zugangsdaten – die kommen
# aus Umgebungsvariablen (siehe .env.example).
#
# Diese Datei ist als Beispiel gedacht. Für den eigenen Haushalt entweder
# hier anpassen oder eine eigene Datei anlegen und darauf zeigen:
#
#     ESSENSPLANER_CONFIG=/pfad/zu/meiner-config.yaml
#
# Im Container liegt sie sinnvoll im Volume, dann überlebt sie jeden Rollout
# und landet nie im Repository.

haushalt:
  erwachsene: 2
  kinder: 1
  # Ein Kind zählt als dieser Anteil einer Erwachsenenportion.
  kind_portionsfaktor: 0.5
  # Daraus ergibt sich der Familienfaktor: 2 + 1*0.5 = 2.5 Erwachsenenportionen.

# Die fünf Kochtage einer Woche.
#
# "tage" ist die Zahl der Esstage, die ein Gericht in diesem Slot abdeckt.
# Sie steht ausdrücklich als Zahl da und nicht nur als Text in "deckt_ab",
# damit sie weder vom Planer noch beim Lesen abgeleitet werden muss:
# Freitag, Samstag und Sonntag sind je ein Tag, Montag und Mittwoch decken
# zwei (der Folgetag ist die Mittagsportion). Mehr als zwei Tage deckt
# kein Gericht ab.
slots:
  FR:
    kochtag: Freitag
    deckt_ab: "Freitag Abend"
    tage: 1
    esser: familie
    anspruch: "Familie, kindertauglich"
  SA:
    kochtag: Samstag
    deckt_ab: "Samstag"
    tage: 1
    esser: familie
    anspruch: "darf aufwendiger, süß oder zünftig sein"
  SO:
    kochtag: Sonntag
    deckt_ab: "Sonntag"
    tage: 1
    esser: familie
    anspruch: "darf aufwendiger, süß oder zünftig sein"
  MO:
    kochtag: Montag
    deckt_ab: "Montag + Dienstag Mittag"
    tage: 2
    esser: erwachsene
    portionen: 4
    anspruch: "schnell, proteinreich, aufwärmbar"
  MI:
    kochtag: Mittwoch
    deckt_ab: "Mittwoch + Donnerstag Mittag"
    tage: 2
    esser: erwachsene
    portionen: 4
    anspruch: "schnell, proteinreich, aufwärmbar"

ernaehrung:
  # Harte Regel: Mindestprotein je Erwachsenenportion in den Vorkoch-Slots.
  protein_min_g: 30
  protein_slots: [MO, MI]
  # Slots, in denen empfindliche Frischware noch zulässig ist (Einkauf ist Freitag).
  frischware_slots: [FR, SA, SO, MO]
  fischstaebchen_max_pro_monat: 1

planung:
  max_pro_monat: 3
  min_abstand_tage: 7
  core_anteil: 0.6
  # Doppelt kochen und einfrieren, wenn eine Gefriertruhe vorhanden ist.
  freezer: false
  # Pro Wochenende mindestens ein Gericht mit einem dieser Tags.
  wochenende_pflicht_tags: [suess, zuenftig]
  # Seed für reproduzierbare Pläne; null = zufällig.
  seed: null

# Harte Ausschlüsse. Jede Zutat und jede generierte Variante wird gegen diese
# Begriffe geprüft (Name, Slug und Aliase, ohne Rücksicht auf Groß-/Kleinschreibung).
ausschluesse:
  blauschimmel:
    begriffe:
      - blauschimmel
      - gorgonzola
      - roquefort
      - stilton
      - cambozola
      - danablu
      - bavaria blu
      - bergader
      - blue cheese
      - blauschimmelkaese
      - blauschimmelkäse
    # Weißschimmel ist ausdrücklich erlaubt (gebackener Camembert).
    ausnahmen: [camembert, brie, weissschimmel, weißschimmel]
  salbei:
    begriffe: [salbei, sage]
    ausnahmen: []
  fenchel:
    begriffe: [fenchel, fennel, finocchio]
    # "fenchelfrei" auf einer Gewürzmischung ist eine Zusicherung, kein Verstoß.
    ausnahmen: [fenchelfrei, fenchelfreie, "ohne fenchel", "fennel-free"]

# Gewürzmischungen sind nur erlaubt, wenn sie ausdrücklich als fenchelfrei
# markiert sind (Feld `fenchelfrei: true` in ingredients.yaml).
gewuerzmischungen_pruefen: true

mail:
  von: "essensplaner@example.com"
  empfaenger:
    - "erste.person@example.com"
    - "zweite.person@example.com"
  zeitzone: "Europe/Berlin"
  wochenmail_uhrzeit: "07:00"
  betreff_woche: "Essensplan & Einkaufsliste {von}–{bis}"
  betreff_monat: "Monatsplan {monat} + Vorratsliste"
  # Erinnerung am Abend vor dem Einkauf, mit dem fertigen Zettel.
  # Leerer Tag schaltet sie ab.
  erinnerung_tag: "Donnerstag"
  erinnerung_uhrzeit: "18:00"
  betreff_erinnerung: "Morgen einkaufen: {von}–{bis}"

ablauf:
  # Wochenablauf: Vorschlag der Gerichte per ntfy (NTFY_TOPIC in der .env),
  # dann Zettel prüfen und „Zettel fertig“ tippen. Leerer Tag schaltet den
  # Vorschlag ab. Links im Push zeigen auf ESSENSPLANER_BASIS_URL.
  vorschlag_tag: "Mittwoch"
  vorschlag_uhrzeit: "19:30"

mealie:
  # Der Wocheneinkauf geht zusätzlich in diese Mealie-Einkaufsliste, sobald
  # MEALIE_URL und MEALIE_TOKEN gesetzt sind: mit „Zettel fertig“ sofort,
  # sonst spätestens zum Rückfalltermin hier. Gemeint ist der Einkauf am
  # nächsten Freitag. Leerer Tag schaltet den Rückfall ab.
  einkaufsliste: "Wocheneinkauf"
  einkauf_tag: "Donnerstag"
  einkauf_uhrzeit: "18:00"

ai:
  # Neue Rezeptvorschläge über die Claude API. Vorschläge landen in
  # data/recipes/_pending/ und werden erst nach Freigabe eingeplant.
  aktiv: false
  modell: "claude-opus-5"
  vorschlaege_pro_monat: 3
